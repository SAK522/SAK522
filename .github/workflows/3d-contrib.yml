# Builds the 3D isometric contribution chart (with radar + language charts) using
# yoshi389111/github-profile-3d-contrib and the brass theme in config/3d-contrib-brass.json.
# Output: profile-3d-contrib/profile-brass.svg (committed back to this repo).
name: Generate 3D contribution chart

on:
  schedule:
    - cron: "40 18 * * *"   # daily, 00:10 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/3d-contrib-brass.json

      - name: Commit & push the chart
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "Update 3D contribution chart"; then
            git push
          fi
